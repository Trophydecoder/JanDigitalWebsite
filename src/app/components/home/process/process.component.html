<section class="section process">
  <div class="container">
    <div class="heading">
      <div><span class="eyebrow">How we work</span><h2 class="section-title">A simple process.<br>Real results.</h2></div>
      <p class="section-copy">Clear communication, thoughtful design and a process built around your business.</p>
    </div>
    <div class="steps">
      @for (step of steps; track step[0]) {
        <div class="step">
          <strong>{{step[0]}}</strong>
          <h3>{{step[1]}}</h3>
          <p>{{step[2]}}</p>
        </div>
      }
    </div>
  </div>
</section>
